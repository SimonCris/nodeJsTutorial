<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>EntraID Integration</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
<script>

    /** URL del BE, usato dal server per catturare la rotte /getAccessToken che vengono gestite nell'index.js */
    const SERVER_URL = 'http://localhost:3000/';

    function getAccessToken(){

        const doc = document;
        let serverUrl = SERVER_URL + 'getAccessToken';

        /** Recupero degli elementi HTML da modificare */
        let accessToken = doc.querySelector('#accessToken');
        accessToken.innerHTML = '';

        axios.get(serverUrl).then(resp => {
            var responseObject = resp.data;
            accessToken.innerHTML = responseObject.data;

            var cookie = getCookie('entraID');
            // alert('cookie: ' + cookie);

            var src = "https://app.powerbi.com/reportEmbed?reportId=83885f34-50fd-41b6-8b20-ef27c889dece&autoAuth=true&ctid=3048dc87-43f0-4100-9acb-ae1971c79395https://app.powerbi.com/reportEmbed?reportId=83885f34-50fd-41b6-8b20-ef27c889dece&autoAuth=true&ctid=3048dc87-43f0-4100-9acb-ae1971c79395";

            document.getElementById('iframeContainer').src = src;


        }).catch(error=> {
            console.log(error.response)
        })
    }

    function getCookie(name) {
        let cookieArr = document.cookie.split(";");

        for (let i = 0; i < cookieArr.length; i++) {
            let cookiePair = cookieArr[i].split("=");

            if (name === cookiePair[0].trim()) {
                return decodeURIComponent(cookiePair[1]);
            }
        }

        return null;
    }

    function updateIframeUrl() {
        // 2. Accedi al valore dell'input
        var nuovoSrc = document.getElementById('urlInput').value;

        // 3. Verifica che l'URL non sia vuoto o non valido
        if (nuovoSrc.trim() !== '') {
            // 4. Modifica l'attributo src dell'iframe
            document.getElementById('iframeExample').src = nuovoSrc;
        } else {
            alert('Per favore, inserisci un URL valido.');
        }
    }


</script>
</head>
<body>

    <div>

        <h3>EntraID Integration</h3>

        <div class="form-group text-center">
            <button class="btn btn-success" onclick="getAccessToken()">GET ACCESS TOKEN</button>
        </div>

        <table id="accessTokenTable" class="table-responsive table table-dark">
            <tr>
                <th>TOKEN</th>
            </tr>
            <tr>
                <td id="accessToken"></td>
            </tr>
        </table>

    </div>

    <div class="iframe-container">
        <iframe id="iframeContainer" title="RLS Report" width="1140" height="541.25" src="" frameborder="0" allowFullScreen="true"></iframe>
    </div>

</body>
</html>
